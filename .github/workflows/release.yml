name: Release

# Publishing create-authkit-app was a manual `npm publish` from a maintainer's
# laptop (docs/maintainers.md), so what shipped depended on the state of that
# working tree. This publishes from a tag, off a clean checkout, and only after
# the same packaging checks CI runs.
#
# Requires an NPM_TOKEN secret with publish rights on create-authkit-app.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci
        working-directory: cli

      # The tag is the source of truth for the version; a mismatch means the
      # tag was cut before package.json was bumped.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match cli/package.json version $pkg"
            exit 1
          fi
        working-directory: cli

      # Same checks CI runs, so a tag can never ship a tarball CI never saw.
      - name: Build and verify the package
        run: npm run build && npm run bundle-pack-assets && npm run verify-pack && npm run smoke-scaffold && npm run verify-scaffold-docker
        working-directory: cli

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: npm publish --provenance --access public
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
