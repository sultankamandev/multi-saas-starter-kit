name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  cli:
    name: CLI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: cli
      - run: npm run build
        working-directory: cli

  contract:
    name: Generate Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: contract
      - run: npm run generate
        working-directory: contract
      # Fail if the regenerated types differ from what is committed.
      - name: Check generated types are up to date
        run: git diff --exit-code generated/types.ts
        working-directory: contract

  locales:
    name: Locale Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-locales.mjs
        working-directory: contract

  node-express:
    name: Node.js Express Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: templates/backends/node-express
      - run: npx tsc --noEmit
        working-directory: templates/backends/node-express

  go-gin-template:
    name: Go Gin Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: templates/backends/go-gin/go.mod
      - run: go build -o /dev/null ./cmd/server
        working-directory: templates/backends/go-gin
      - run: go vet ./...
        working-directory: templates/backends/go-gin

  python-fastapi-template:
    name: Python FastAPI Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: templates/backends/python-fastapi
      - run: python -m compileall app
        working-directory: templates/backends/python-fastapi

  react-vite-template:
    name: React Vite Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: templates/frontends/react-vite-ts
      - run: npm run build
        working-directory: templates/frontends/react-vite-ts

  next-ts-template:
    name: Next.js Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: templates/frontends/next-ts
      - run: npm run build
        working-directory: templates/frontends/next-ts

  vue-vite-template:
    name: Vue Vite Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: templates/frontends/vue-vite-ts
      - run: npm run build
        working-directory: templates/frontends/vue-vite-ts

  cli-pack-smoke:
    name: CLI Pack and Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build && npm run bundle-pack-assets && npm run verify-pack && npm run smoke-scaffold && npm run verify-scaffold-docker
        working-directory: cli

  # The templates above are built IN PLACE, which is not what users get.
  # This job builds an actual scaffolded project, so drift between the
  # Dockerfiles and the generated layout fails CI instead of the user's laptop.
  scaffold-docker-build:
    name: Scaffolded Project Docker Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: go-gin
            frontend: react-vite-ts
          - backend: python-fastapi
            frontend: next-ts
          - backend: node-express
            frontend: vue-vite-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: cli
      - name: Scaffold project
        run: node scripts/scaffold-one.mjs "$RUNNER_TEMP/app" ${{ matrix.backend }} ${{ matrix.frontend }}
        working-directory: cli
      - name: Validate compose file
        run: docker compose config
        working-directory: ${{ runner.temp }}/app
      - name: Build images
        run: docker compose build
        working-directory: ${{ runner.temp }}/app
