name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Superseded runs on the same ref are wasted minutes; main and develop are
# exempt so release history keeps a complete result for every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  cli:
    name: CLI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - run: npm run build
        working-directory: cli

  contract:
    name: Generate Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contract/package-lock.json
      - run: npm ci
        working-directory: contract
      - run: npm run generate
        working-directory: contract
      # Fail if the regenerated types differ from what is committed.
      - name: Check generated types are up to date
        run: git diff --exit-code generated/types.ts
        working-directory: contract

  locales:
    name: Locale Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-locales.mjs
        working-directory: contract

  node-express:
    name: Node.js Express Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/backends/node-express/package-lock.json
      - run: npm ci
        working-directory: templates/backends/node-express
      - run: npx tsc --noEmit
        working-directory: templates/backends/node-express

  go-gin-template:
    name: Go Gin Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: templates/backends/go-gin/go.mod
          cache-dependency-path: templates/backends/go-gin/go.sum
      - run: go build -o /dev/null ./cmd/server
        working-directory: templates/backends/go-gin
      - run: go vet ./...
        working-directory: templates/backends/go-gin

  python-fastapi-template:
    name: Python FastAPI Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: templates/backends/python-fastapi/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: templates/backends/python-fastapi
      - run: python -m compileall app
        working-directory: templates/backends/python-fastapi

  react-vite-template:
    name: React Vite Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/frontends/react-vite-ts/package-lock.json
      - run: npm ci
        working-directory: templates/frontends/react-vite-ts
      - run: npm run build
        working-directory: templates/frontends/react-vite-ts

  next-ts-template:
    name: Next.js Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/frontends/next-ts/package-lock.json
      - run: npm ci
        working-directory: templates/frontends/next-ts
      - run: npm run build
        working-directory: templates/frontends/next-ts

  vue-vite-template:
    name: Vue Vite Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/frontends/vue-vite-ts/package-lock.json
      - run: npm ci
        working-directory: templates/frontends/vue-vite-ts
      - run: npm run build
        working-directory: templates/frontends/vue-vite-ts

  cli-pack-smoke:
    name: CLI Pack and Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci && npm run build && npm run bundle-pack-assets && npm run verify-pack && npm run smoke-scaffold && npm run verify-scaffold-docker
        working-directory: cli

  # The templates above are built IN PLACE, which is not what users get.
  # This job builds an actual scaffolded project, so drift between the
  # Dockerfiles and the generated layout fails CI instead of the user's laptop.
  scaffold-docker-build:
    name: Scaffolded Project Docker Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: go-gin
            frontend: react-vite-ts
          - backend: python-fastapi
            frontend: next-ts
          - backend: node-express
            frontend: vue-vite-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci && npm run build
        working-directory: cli
      - name: Scaffold project
        run: node scripts/scaffold-one.mjs "$RUNNER_TEMP/app" ${{ matrix.backend }} ${{ matrix.frontend }}
        working-directory: cli
      - name: Validate compose file
        run: docker compose config
        working-directory: ${{ runner.temp }}/app
      - name: Build images
        run: docker compose build
        working-directory: ${{ runner.temp }}/app

  # The 34-check compliance suite, run against a real running backend for every
  # stack. This is the only job that proves the three implementations actually
  # agree with contract/openapi.yaml — everything above only proves they compile.
  #
  # It runs against a *scaffolded* project rather than the template in place, so
  # the generated compose file, the Mailpit wiring, and the admin command are all
  # under test too. Both the admin checks and the email/2FA flow checks skip
  # themselves when unconfigured, so the credentials below are what makes the
  # count 34 instead of 13.
  compliance:
    name: API Compliance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: go-gin
            port: 8080
          - backend: python-fastapi
            port: 8000
          - backend: node-express
            port: 8080
    env:
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: "TestPass123!@#"
      APP_DIR: ${{ runner.temp }}/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci && npm run build
        working-directory: cli

      - name: Scaffold project
        run: node scripts/scaffold-one.mjs "$APP_DIR" ${{ matrix.backend }} react-vite-ts
        working-directory: cli

      # The frontend is not under test here and its build is the slow part.
      - name: Start postgres, mailpit and the backend
        run: docker compose up -d --build postgres mailpit backend
        working-directory: ${{ runner.temp }}/app

      - name: Wait for the API
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:${{ matrix.port }}/ping >/dev/null; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend never became healthy"
          docker compose logs backend
          exit 1
        working-directory: ${{ runner.temp }}/app

      - name: Create and promote the admin account
        run: |
          curl -sf -X POST http://localhost:${{ matrix.port }}/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"ciadmin\",\"first_name\":\"CI\",\"last_name\":\"Admin\",\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}"
          npm run admin:docker -- "$ADMIN_EMAIL"
        working-directory: ${{ runner.temp }}/app

      - name: Run the compliance suite
        run: npm test
        working-directory: ${{ runner.temp }}/app

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend
        working-directory: ${{ runner.temp }}/app
